[project]
name = "soft-shell-calculator-lib"
version = "0.1.0"
description = "Backend library for analyzing RPD measurements of wooden foundation piles."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soft_shell_calculator_lib"]
