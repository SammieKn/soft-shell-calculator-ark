[project]
name = "soft-shell-calculator-lib"
version = "0.1.0"
description = "Backend library for the soft shell calculator"
readme = "README.md"
authors = [
    { name = "Sammie", email = "114987952+SammieKn@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "scipy>=1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
